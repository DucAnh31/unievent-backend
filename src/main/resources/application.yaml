server:
  port: 8080
spring:
  application:
    name: unievent
  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DMS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret-key: ${JWT_SECRET_KEY}
  valid-duration: 600000 # ms
  refresh-duration: 1200000 # ms

app:
  frontend-base-url: ${FRONTEND_BASE_URL}